stages:
  - validate
  - maintenance

android-shell-validation:
  stage: validate
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash fish
  script:
    - for file in androidCurlScripts.sh android/scripts/manage-shopping-traffic.sh android/termux-scripts/termux-manage-shopping-traffic.sh network/scripts/hotspot-background-traffic-control.sh android/termux-scripts/termux-hotspot-traffic-control.sh; do bash -n "$file"; done
    - for file in android/scripts/manage-shopping-traffic.fish android/termux-scripts/termux-manage-shopping-traffic.fish network/scripts/hotspot-background-traffic-control.fish android/termux-scripts/termux-hotspot-traffic-control.fish; do fish -n "$file"; done
    - bash android/tests/test-curl-wrapper.sh
    - bash android/tests/test-app-package-catalog.sh
    - bash -n android/scripts/app-data-saver.sh
    - bash android/tests/test-app-data-saver.sh
    - if grep -nE "settings put global (mobile_data_always_on|tether_dun_required|tether_offload_disabled)" android/scripts/manage-shopping-traffic.sh android/scripts/manage-shopping-traffic.fish android/termux-scripts/termux-manage-shopping-traffic.sh android/termux-scripts/termux-manage-shopping-traffic.fish network/scripts/hotspot-background-traffic-control.sh network/scripts/hotspot-background-traffic-control.fish; then exit 1; fi
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

update-readme:
  stage: maintenance
  image: python:3.12-slim
  before_script:
    - apt-get update --quiet
    - apt-get install --quiet --yes --no-install-recommends git
  script:
    - python3 scripts/update-readme.py
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci[bot]@users.noreply.gitlab.com"
    - git add README.md
    - |
      if git diff --cached --quiet; then
        echo "README is already up to date."
      elif [ -z "${GITLAB_PUSH_TOKEN:-}" ]; then
        echo "README changed. Set a masked GITLAB_PUSH_TOKEN CI variable to let CI commit it."
        exit 1
      else
        git commit -m "Auto-update README index for new research papers and fix files"
        git push "https://oauth2:${GITLAB_PUSH_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_BRANCH}"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
      changes:
        - papers/**/*
        - linux/**/*
        - android/**/*
        - network/**/*
        - windows/**/*
        - cross-platform/**/*
        - ai-providers/**/*
        - developer-tools/**/*
        - creative-ascii-design/**/*
        - scripts/update-readme.py
    - if: $CI_PIPELINE_SOURCE == "web"
