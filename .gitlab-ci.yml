# GitLab counterpart to .github/workflows/validate-curl-scripts.yml.
# This branch has no update-readme generator; the job only validates the
# launchers the way the GitHub Action does.
stages:
  - validate

validate-curl-scripts:
  stage: validate
  image: ubuntu:24.04
  script:
    - bash -n androidCurlScripts.sh linuxCurlScripts.sh
    - test -x androidCurlScripts.sh
    - test -x linuxCurlScripts.sh
    - grep -q 'raw.githubusercontent.com/bitzzdev/devSubstrate/' androidCurlScripts.sh
    - grep -q 'raw.githubusercontent.com/bitzzdev/devSubstrate/' linuxCurlScripts.sh
    - grep -q 'gitlab.com/bitzzdev/devSubstrate/-/raw/' androidCurlScripts.sh
    - grep -q 'gitlab.com/bitzzdev/devSubstrate/-/raw/' linuxCurlScripts.sh
    - grep -q 'SOURCE_REF' androidCurlScripts.sh
    - grep -q 'SOURCE_REF' linuxCurlScripts.sh
    - grep -q 'DEVSUBSTRATE_REMOTE' androidCurlScripts.sh
    - grep -q 'DEVSUBSTRATE_REMOTE' linuxCurlScripts.sh
