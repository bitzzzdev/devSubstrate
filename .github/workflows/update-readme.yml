name: Update README Index

on:
  push:
    branches:
      - main
    paths:
      - 'papers/**'
      - 'linux/**'
      - 'android/**'
      - 'network/**'
      - 'windows/**'
      - 'cross-platform/**'
      - 'ai-providers/**'
      - 'developer-tools/**'
      - 'creative-ascii-design/**'
      - 'scripts/update-readme.py'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate README index
        run: python3 scripts/update-readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update README index for new research papers and fix files"
            git push origin main
          else
            echo "README is already up to date."
          fi
